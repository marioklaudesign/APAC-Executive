<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney APAC Executive Leadership Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        disneyBlue: '#1a365d',
                        disneyLight: '#2b6cb0',
                        accent: '#2563eb'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans" x-data="directoryApp()">

    <!-- Header -->
    <header class="bg-disneyBlue text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow-inner text-white text-xl font-bold">
                    <i class="fa-solid fa-users-rectangle"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Executive Team Directory</h1>
                    <p class="text-xs sm:text-sm text-blue-200">Asia Pacific Leadership & Regional Contacts</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="w-full md:w-80">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" x-model="searchQuery" placeholder="Search name, title, email..." 
                        class="w-full pl-10 pr-4 py-2 bg-slate-800/80 text-white placeholder-slate-400 border border-slate-700 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 transition">
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8 flex flex-col gap-6">

        <!-- Region Filter Tabs -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button @click="selectedCountry = 'ALL'" 
                :class="selectedCountry === 'ALL' ? 'bg-disneyBlue text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'"
                class="px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition">
                🌐 All Regions (<span x-text="members.length"></span>)
            </button>
            <template x-for="(name, code) in regions" :key="code">
                <button @click="selectedCountry = code"
                    :class="selectedCountry === code ? 'bg-disneyBlue text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'"
                    class="px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition flex items-center gap-2">
                    <span x-text="regionFlags[code]"></span>
                    <span x-text="name"></span>
                    <span class="text-xs px-1.5 py-0.5 rounded-full" :class="selectedCountry === code ? 'bg-blue-800 text-white' : 'bg-slate-100 text-slate-500'" x-text="getRegionCount(code)"></span>
                </button>
            </template>
        </div>

        <!-- Directory Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <template x-for="member in filteredMembers" :key="member.id">
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition duration-200 flex flex-col overflow-hidden group">
                    
                    <!-- Card Top Banner / Region Badge -->
                    <div class="bg-slate-100 px-4 py-2 border-b border-slate-100 flex justify-between items-center text-xs font-semibold text-slate-500">
                        <span class="flex items-center gap-1.5">
                            <span x-text="regionFlags[member.Country]"></span>
                            <span x-text="regions[member.Country] || member.Country"></span>
                        </span>
                        <span class="text-[10px] text-slate-400 uppercase tracking-wider" x-text="member.Country"></span>
                    </div>

                    <!-- Card Body -->
                    <div class="p-5 flex flex-col items-center text-center flex-1">
                        
                        <!-- Avatar / Headshot container -->
                        <div class="relative w-24 h-24 mb-4">
                            <img :src="member.image" @error="$el.src=''" alt="Headshot" 
                                 class="w-full h-full rounded-full object-cover border-2 border-white shadow-md bg-slate-200"
                                 x-show="hasImage(member.image)">
                            
                            <!-- Fallback Initials if image fails or is missing -->
                            <div class="w-full h-full rounded-full flex items-center justify-center text-white font-bold text-xl shadow-md"
                                 :style="'background-color: ' + getAvatarColor(member.Name)"
                                 x-show="!hasImage(member.image)">
                                <span x-text="getInitials(member.Name)"></span>
                            </div>
                        </div>

                        <!-- Name & Title -->
                        <h3 class="font-bold text-slate-900 text-base mb-1" x-text="member.Name"></h3>
                        <p class="text-xs text-slate-500 min-h-[2.5rem] flex items-center justify-center line-clamp-2 mb-4" x-text="member.Designation || 'Team Member'"></p>

                        <!-- Contact Info -->
                        <div class="w-full border-t border-slate-100 pt-3 mt-auto space-y-2 text-left text-xs">
                            <template x-if="member.Email">
                                <a :href="'mailto:' + member.Email" class="flex items-center gap-2 text-blue-600 hover:underline truncate">
                                    <i class="fa-solid fa-envelope w-4 text-slate-400"></i>
                                    <span class="truncate" x-text="member.Email"></span>
                                </a>
                            </template>
                            <template x-if="!member.Email">
                                <div class="flex items-center gap-2 text-slate-400 truncate">
                                    <i class="fa-solid fa-envelope w-4 text-slate-300"></i>
                                    <span class="truncate italic">No email</span>
                                </div>
                            </template>

                            <div class="flex items-center gap-2 text-slate-600 truncate">
                                <i class="fa-solid fa-phone w-4 text-slate-400"></i>
                                <span class="truncate" x-text="member['Phone Number'] || 'N/A'"></span>
                            </div>
                        </div>

                    </div>
                </div>
            </template>
        </div>

        <!-- Empty state -->
        <div x-show="filteredMembers.length === 0" class="text-center py-16 bg-white rounded-2xl border border-slate-200">
            <div class="text-4xl text-slate-300 mb-3"><i class="fa-solid fa-folder-open"></i></div>
            <h3 class="text-lg font-semibold text-slate-700">No executives found</h3>
            <p class="text-sm text-slate-500">Try adjusting your search query or region filter.</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-6 text-center text-xs text-slate-500">
        <p>Disney APAC Executive Leadership Directory • Hosted via Vercel</p>
    </footer>

        function directoryApp() {
            return {
                members: membersData,
                searchQuery: '',
                selectedCountry: 'ALL',
                regions: {
                    "AU": "Australia",
                    "CN": "China",
                    "HK": "Hong Kong",
                    "IN": "India",
                    "JP": "Japan",
                    "KR": "Korea",
                    "SG": "Singapore"
                },
                regionFlags: {
                    "AU": "🇦🇺",
                    "CN": "🇨🇳",
                    "HK": "🇭🇰",
                    "IN": "🇮🇳",
                    "JP": "🇯🇵",
                    "KR": "🇰🇷",
                    "SG": "🇸🇬"
                },
                get filteredMembers() {
                    return this.members.filter(m => {
                        const matchesCountry = (this.selectedCountry === 'ALL' || m.Country === this.selectedCountry);
                        const query = this.searchQuery.toLowerCase();
                        const matchesSearch = !query || 
                            (m.Name && m.Name.toLowerCase().includes(query)) ||
                            (m.Designation && m.Designation.toLowerCase().includes(query)) ||
                            (m.Email && m.Email.toLowerCase().includes(query)) ||
                            (m['Phone Number'] && m['Phone Number'].toLowerCase().includes(query));
                        return matchesCountry && matchesSearch;
                    });
                },
                getRegionCount(code) {
                    return this.members.filter(m => m.Country === code).length;
                },
                hasImage(imgPath) {
                    // Simple check if image path is provided
                    return imgPath && imgPath.trim() !== '';
                },
                getInitials(name) {
                    if (!name) return 'EX';
                    const parts = name.split(' ');
                    return parts.length >= 2 ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase() : parts[0][0].toUpperCase();
                },
                getAvatarColor(name) {
                    const colors = ['#1a365d', '#2b6cb0', '#2c5282', '#1d4ed8', '#0369a1', '#0f766e'];
                    let hash = 0;
                    if (!name) return colors[0];
                    for (let i = 0; i < name.length; i++) {
                        hash = name.charCodeAt(i) + ((hash << 5) - hash);
                    }
                    return colors[Math.abs(hash) % colors.length];
                }
            }
        }
    </script>
