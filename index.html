<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney APAC Executive Leadership Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navyDark: '#040b19',      /* Deepest midnight navy */
                        navyBase: '#091838',      /* Rich primary navy background */
                        navyCard: '#0f244e',      /* Card fill color */
                        navyLight: '#183366',     /* Hover & border highlights */
                        silverLight: '#f1f5f9',   /* Metallic shield sheen */
                        silverMid: '#94a3b8',     /* Metallic silver border */
                        glowBlue: '#38bdf8',      /* Radiant lens flair cyan */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-b from-navyDark via-navyBase to-navyDark min-h-screen text-slate-100 font-sans" x-data="directoryApp()">

    <header class="bg-gradient-to-r from-navyDark via-navyBase to-navyDark text-white shadow-xl border-b border-blue-900/40 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="flex items-center space-x-3.5">
                <div class="relative flex-shrink-0 group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-glowBlue/40 to-blue-600/40 rounded-xl blur-sm opacity-75 group-hover:opacity-100 transition duration-300"></div>
                    
                    <div class="relative w-12 h-12 rounded-xl bg-gradient-to-b from-slate-200 via-slate-400 to-slate-700 p-[1.5px] shadow-2xl flex items-center justify-center overflow-hidden">
                        <div class="w-full h-full bg-gradient-to-b from-[#11244d] to-[#050e21] rounded-[10px] flex items-center justify-center relative">
                            
                            <div class="absolute top-1 left-2 w-2 h-2 bg-white rounded-full blur-[1px] opacity-90"></div>
                            <i class="fa-solid fa-sparkles text-[8px] text-white absolute top-0.5 left-1.5 opacity-80"></i>

                            <svg class="w-7 h-7 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] text-slate-100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L3 6V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V6L12 2Z" 
                                      fill="url(#silverGradient)" stroke="#e2e8f0" stroke-width="0.75"/>
                                <path d="M9 7H12.5C15 7 16.5 8.5 16.5 11.5C16.5 14.5 15 16 12.5 16H9V7Z" 
                                      stroke="#0f2042" stroke-width="2" stroke-linecap="round"/>
                                <path d="M8 5.5L8 18.5" stroke="#0f2042" stroke-width="2" stroke-linecap="round"/>
                                
                                <defs>
                                    <linearGradient id="silverGradient" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                                        <stop offset="0%" stop-color="#ffffff"/>
                                        <stop offset="35%" stop-color="#cbd5e1"/>
                                        <stop offset="70%" stop-color="#64748b"/>
                                        <stop offset="100%" stop-color="#334155"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white drop-shadow-sm">Executive Team Directory</h1>
                        <span class="text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-blue-900/60 border border-blue-400/30 text-glowBlue">Security</span>
                    </div>
                    <p class="text-xs sm:text-sm text-slate-300">Asia Pacific Leadership & Regional Contacts</p>
                </div>
            </div>

            <div class="w-full md:w-80">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" 
                           x-model="searchQuery" 
                           placeholder="Search executive name, title, or city..." 
                           class="w-full pl-9 pr-4 py-2 bg-navyDark/80 border border-slate-700/60 rounded-xl text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-glowBlue focus:border-transparent transition-all">
                </div>
            </div>

        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8 flex flex-col gap-6">

        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button @click="selectedCountry = 'ALL'" 
                :class="selectedCountry === 'ALL' ? 'bg-blue-600 text-white shadow-md border-transparent' : 'bg-navyCard/60 text-slate-300 hover:bg-navyLight border border-slate-700/60'"
                class="px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all border">
                🌐 All Regions (<span x-text="members.length"></span>)
            </button>
            <template x-for="(name, code) in regions" :key="code">
                <button @click="selectedCountry = code"
                    :class="selectedCountry === code ? 'bg-blue-600 text-white shadow-md border-transparent' : 'bg-navyCard/60 text-slate-300 hover:bg-navyLight border border-slate-700/60'"
                    class="px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all border flex items-center gap-2">
                    <span x-text="regionFlags[code]"></span>
                    <span x-text="name"></span>
                    <span class="text-xs px-1.5 py-0.5 rounded-full" :class="selectedCountry === code ? 'bg-blue-900/60 text-blue-100' : 'bg-slate-800 text-slate-400'" x-text="getRegionCount(code)"></span>
                </button>
            </template>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <template x-for="member in filteredMembers" :key="member.id">
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition duration-200 flex flex-col overflow-hidden group">
                    
                    <div class="bg-slate-100 px-4 py-2 border-b border-slate-100 flex justify-between items-center text-xs font-semibold text-slate-500">
                        <span class="flex items-center gap-1.5">
                            <span x-text="regionFlags[member.Country]"></span>
                            <span x-text="regions[member.Country] || member.Country"></span>
                        </span>
                        <span class="text-[10px] text-slate-400 uppercase tracking-wider" x-text="member.Country"></span>
                    </div>

                    <div class="p-5 flex flex-col items-center text-center flex-1">
                        
                        <div class="relative w-24 h-24 mb-4">
                            <img :src="member.image" @error="$el.src=''" alt="Headshot" 
                                 class="w-full h-full rounded-full object-cover border-2 border-white shadow-md bg-slate-200"
                                 x-show="hasImage(member.image)">
                            
                            <div class="w-full h-full rounded-full flex items-center justify-center text-white font-bold text-xl shadow-md"
                                 :style="'background-color: ' + getAvatarColor(member.Name)"
                                 x-show="!hasImage(member.image)">
                                <span x-text="getInitials(member.Name)"></span>
                            </div>
                        </div>

                        <h3 class="font-bold text-slate-900 text-base mb-1" x-text="member.Name"></h3>
                        <p class="text-xs text-slate-500 min-h-[2.5rem] flex items-center justify-center line-clamp-2 mb-4" x-text="member.Designation || 'Team Member'"></p>

                        <div class="w-full border-t border-slate-100 pt-3 mt-auto space-y-2 text-left text-xs">
                            <template x-if="member.Email">
                                <a :href="'mailto:' + member.Email" class="flex items-center gap-2 text-blue-600 hover:underline truncate">
                                    <i class="fa-solid fa-envelope w-4 text-slate-400"></i>
                                    <span class="truncate" x-text="member.Email"></span>
                                </a>
                            </template>
                            <template x-if="!member.Email">
                                <div class="flex items-center gap-2 text-slate-400 truncate">
                                    <i class="fa-solid fa-envelope w-4 text-slate-300"></i>
                                    <span class="truncate italic">No email</span>
                                </div>
                            </template>

                            <div class="flex items-center gap-2 text-slate-600 truncate">
                                <i class="fa-solid fa-phone w-4 text-slate-400"></i>
                                <span class="truncate" x-text="member['Phone Number'] || 'N/A'"></span>
                            </div>
                        </div>

                    </div>
                </div>
            </template>
        </div>

        <div x-show="filteredMembers.length === 0" class="text-center py-16 bg-white rounded-2xl border border-slate-200">
            <div class="text-4xl text-slate-300 mb-3"><i class="fa-solid fa-folder-open"></i></div>
            <h3 class="text-lg font-semibold text-slate-700">No executives found</h3>
            <p class="text-sm text-slate-500">Try adjusting your search query or region filter.</p>
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 mt-auto py-6 text-center text-xs text-slate-500">
        <p>Disney APAC Executive Leadership Directory • Hosted via Vercel</p>
    </footer>
